<input
  type="password"
  [id]="id"
  [value]="value"
  [disabled]="isDisabled"
  (input)="onInput($event)"
  (blur)="onTouched()"
  class="
    w-full
    px-4 py-3
    border border-gray-300
    rounded-lg
    bg-gray-50
    text-gray-900
    focus:outline-none
    focus:ring-2
    focus:ring-blue-500
    focus:border-blue-500
    transition-all duration-200
  "
>
