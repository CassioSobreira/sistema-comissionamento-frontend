<div class="relative w-full">

  <input
    [type]="isPasswordVisible ? 'text' : 'password'"
    [id]="id"
    [value]="value"
    [disabled]="isDisabled"
    (input)="onInput($event)"
    (blur)="onTouched()"
    class="
      w-full
      px-4 py-3 pr-10 border border-gray-300
      rounded-lg
      bg-gray-50
      text-gray-900
      focus:outline-none
      focus:ring-2
      focus:ring-blue-500
      focus:border-blue-500
      transition-all duration-200
    "
  >

  <i 
    class="pi absolute top-1/2 -translate-y-1/2 right-4 text-gray-500 cursor-pointer"
    [ngClass]="{ 'pi-eye': !isPasswordVisible, 'pi-eye-slash': isPasswordVisible }"
    (click)="togglePasswordVisibility()">
  </i>

</div>
