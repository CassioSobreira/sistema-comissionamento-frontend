<div class="flex justify-center">
  <p-card [style]="{ width: '26rem', overflow: 'hidden' }">
    <ng-template pTemplate="header">
      <div class="flex items-center gap-3 p-2">
        <p-avatar icon="pi pi-user" shape="circle"></p-avatar>
        <div>
          <strong>{{ data.nome }}</strong>
          <p-tag
            [value]="getModuleLabel()"
            [icon]="getModuleIcon()"
            [severity]="getModuleSeverity()"
            [ngClass]="getModuleClass(data.modulo)">
            </p-tag>
          <div class="flex gap-2 mt-1">
            <p class="font-bold">Status:</p>
            <p-tag [value]="data.status" [severity]="getStatusSeverity()"></p-tag>
          </div>
        </div>
      </div>
    </ng-template>

    <div class="text-center mt-3 mb-5">
      <p class="font-medium">Requisição de assinatura de</p>
      <p class="font-bold text-gray-200">{{ data.nomeDocumento }}</p>

      <img *ngIf="data.imageUrl; else placeholder"
           [src]="data.imageUrl"
           alt="documento"
           class="mt-3 mx-auto rounded shadow w-full object-cover" />

      <ng-template #placeholder>
        <div class="rounded w-full h-48 bg-gray-100 flex items-center justify-center text-gray-400">
          <i class="pi pi-image text-3xl"></i>
        </div>
      </ng-template>
    </div>

    <ng-template pTemplate="footer">
      <div class="flex justify-center gap-4">
        <p-button label="Rejeitar" severity="secondary" class="mr-24" [outlined]="true" (onClick)="reject.emit()"></p-button>
        <p-button label="Aprovar" class="" (onClick)="approve.emit()"></p-button>
      </div>
    </ng-template>
  </p-card>
</div>
