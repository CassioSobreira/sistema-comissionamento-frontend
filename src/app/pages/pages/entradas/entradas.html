<menu-bar></menu-bar>

<div class="p-4 sm:p-6 text-white">
<div class="flex items-center justify-center relative mb-8">
  
  <h1 class="text-xl font-bold text-white">Selecione um Documento</h1>

  <p-button 
    label="Voltar para Módulos" 
    icon="pi pi-arrow-left" 
    (click)="voltarParaModulos()" 
    [outlined]="true" 
    styleClass="p-button-sm"
    class="absolute left-0 top-1/2 -translate-y-1/2">
  </p-button>
</div>

  <div class="content-container">

    @if (isLoading) {
      <div class="flex justify-center mt-8">
        <p-progressSpinner 
          class="w-12 h-12" 
          strokeWidth="6" 
          animationDuration=".5s">
        </p-progressSpinner>
      </div>
    } @else {

      @if (entradas.length > 0) {
        <div class="flex flex-col items-center gap-4">
          @for (entrada of entradas; track entrada.id_entrada) {
            <div 
              (click)="selecionarEntrada(entrada.id_entrada)"
              class="w-full max-w-2xl bg-gray-800 p-5 rounded-lg shadow-lg cursor-pointer 
                     hover:bg-gray-700 hover:shadow-blue-500/20 transition-all duration-300 
                     text-center border border-gray-700">
              <h3 class="font-bold text-lg text-gray-100">{{ entrada.nome_entrada }}</h3>
            </div>
          }
        </div>
      } @else {

        <div class="text-center mt-8 bg-gray-800/50 p-6 rounded-lg max-w-lg mx-auto">
          <i class="pi pi-inbox text-4xl text-gray-500 mb-4"></i>
          <h3 class="text-xl font-bold text-gray-300">Nenhum Documento Encontrado</h3>
          <p class="text-gray-400 mt-2">Não há tipos de documento disponíveis para este módulo no momento.</p>
        </div>
        
      }
    }
  </div>
</div>
