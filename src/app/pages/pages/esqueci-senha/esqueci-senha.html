<div class="flex min-h-screen items-center justify-center p-4">

  <div class="bg-white rounded-xl p-8 shadow-2xl w-full max-w-md text-gray-800">

    <div class="text-center">
      <h2 class="text-2xl font-bold mb-2">Esqueceu sua senha?</h2>
      <p class="text-gray-500 mb-8">Digite seu e-mail para receber um link de redefinição.</p>
    </div>

    <form [formGroup]="esqueciSenhaForm" (ngSubmit)="onSubmit()">
      <div class="flex flex-col gap-2 text-left mb-6">
          <label for="email" class="text-sm font-bold text-gray-600">Email</label>
          <app-input-text-component 
            formControlName="email"
            id="email">
          </app-input-text-component>
        </div>
      
      <button 
        type="submit"
        [disabled]="esqueciSenhaForm.invalid || isLoading"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
        @if (isLoading) {
          <span>Enviando...</span>
        } @else {
          <span>Enviar Link de Redefinição</span>
        }
      </button>
    </form>

    <a (click)="navegarParaLogin()" class="block mt-6 text-center text-sm text-blue-600 hover:underline cursor-pointer">
      Voltar para o login
    </a>
  </div>
</div>
