<!-- 
  Container principal da página, mantendo o padrão visual.
  - Centraliza o conteúdo na tela.
  - O fundo gradiente já é herdado do styles.css.
-->
<div class="flex min-h-screen items-center justify-center p-4">

  <!-- 
    Card do formulário.
    - Estilo consistente com as telas anteriores.
  -->
  <div class="bg-white rounded-xl p-8 shadow-2xl w-full max-w-md text-gray-800">

    <!-- Cabeçalho -->
    <div class="text-center">
      <h2 class="text-2xl font-bold mb-2">Esqueceu sua senha?</h2>
      <p class="text-gray-500 mb-8">Digite seu e-mail para receber um link de redefinição.</p>
    </div>

    <!-- Formulário -->
    <div>
      <!-- Campo de E-mail -->
      <div class="mb-5 text-left">
        <label for="email" class="block mb-2 text-sm font-medium text-gray-700">E-mail</label>
        <input 
          type="email" 
          id="email" 
          placeholder="seuemail@exemplo.com"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition"
        >
      </div>
      
      <!-- Botão de Ação Principal -->
      <button 
        (click)="navegarParaRedefinirSenha($event)"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors duration-300">
        Enviar Link de Redefinição
      </button>
    </div>

    <!-- Link de Voltar -->
    <a (click)="navegarParaLogin()" class="block mt-6 text-center text-sm text-blue-600 hover:underline cursor-pointer">
      Voltar para o login
    </a>
  </div>
</div>
