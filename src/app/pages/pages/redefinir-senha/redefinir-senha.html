<div class="flex min-h-screen items-center justify-center p-4">

  <div class="bg-white rounded-xl p-8 shadow-2xl w-full max-w-md text-gray-800">

    <div class="text-center">
      <h2 class="text-2xl font-bold mb-2">Crie sua Nova Senha</h2>
      <p class="text-gray-500 mb-8">Digite e confirme sua nova senha de acesso.</p>
    </div>

    <form [formGroup]="redefinirSenhaForm" (ngSubmit)="onSubmit()">
      <div class="flex flex-col gap-6">

        <div class="flex flex-col gap-2 text-left">
          <label for="novaSenha" class="text-sm font-bold text-gray-600">Nova Senha</label>
          <app-password-input-component
            formControlName="novaSenha"
            id="novaSenha">
          </app-password-input-component>
        </div>

        <div class="flex flex-col gap-2 text-left">
          <label for="confirmarSenha" class="text-sm font-bold text-gray-600">Confirmar Nova Senha</label>
          <app-password-input-component
            formControlName="confirmarSenha"
            id="confirmarSenha">
          </app-password-input-component>
        </div>
      
        <button 
          type="submit"
          [disabled]="redefinirSenhaForm.invalid || isLoading"
          class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
          @if (isLoading) {
            <span>Salvando...</span>
          } @else {
            <span>Redefinir Senha</span>
          }
        </button>

      </div>
    </form>
  </div>
</div>
