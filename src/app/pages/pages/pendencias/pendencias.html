<menu-bar></menu-bar>

<div class="text-white">
  <h1 class="mt-4 text-2xl font-bold mb-6 text-center">Minhas Pendências</h1>

  <div class="flex justify-end mb-4 pr-5">
    <p-button
      label="Filtrar"
      icon="pi pi-filter"
      styleClass="w-full sm:w-auto"
      (onClick)="visible = true">
    </p-button>
  </div>

  <!-- DRAWER DE FILTRO -->
  <p-drawer
      header="Filtrar Pendências"
      [(visible)]="visible"
      position="top"
      [modal]="true"
      [dismissible]="true"
      [style]="{ 'background-color': '#181818', 'border': 'none', 'color': 'white', 'height': 'auto' }">

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">

      <!-- FILTRO POR NOME -->
  <!-- FILTRO POR NOME -->
  <div class="flex flex-col">
    <label class="mb-1 font-semibold">Nome do Documento</label>
    <input
      pInputText
      placeholder="Digite o nome"
      class="w-full"
    />
  </div>

  <!-- FILTRO POR MÓDULO (DROPDOWN) -->
  <div class="flex flex-col">
        <label class="mb-1 font-semibold">Módulo</label>
        <p-autocomplete
          [(ngModel)]="value"
          [suggestions]="filteredModulos"
          (completeMethod)="search($event)"
          [dropdown]="true"
          optionLabel="nome"
          placeholder="Selecione o módulo"
          class="w-full"
        ></p-autocomplete>
      </div>

      <!-- FILTRO POR USUÁRIO -->
      <div class="flex flex-col">
        <label class="mb-1 font-semibold">Usuário</label>
        <input
          pInputText
          placeholder="Digite o nome do usuário"
          class="w-full"
        />
      </div>
      

    </div>

    <div class="flex justify-end gap-3 mt-6">
      <p-button
        label="Limpar"
        severity="secondary"
        styleClass="w-full sm:w-auto">
      </p-button>

      <p-button
        label="Aplicar Filtros"
        icon="pi pi-check"
        styleClass="w-full sm:w-auto">
      </p-button>
    </div>

  </p-drawer>


  <p-tabs [(value)]="abaAtiva">
    <p-tablist>
      <p-tab [value]="0">Em Andamento</p-tab>
      <p-tab [value]="1">Concluídas</p-tab>
    </p-tablist>

    <p-tabpanels>

      <!-- ===========================
           ABA: EM ANDAMENTO
      ============================ -->
      <p-tabpanel [value]="0">

        <div *ngIf="pendenciasEmAndamento.length; else vazioAndamento">
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-6">
            <app-card-pendencia-component
              *ngFor="let item of pendenciasEmAndamento | slice:firstAndamento:(firstAndamento + rowsAndamento)"
              [data]="item"
              (aprovar)="aprovar(item.idDocumento)"
              (rejeitar)="rejeitar(item.idDocumento)">
            </app-card-pendencia-component>
          </div>

          <div class="card flex justify-center mt-6">
            <p-paginator
              [first]="firstAndamento"
              [rows]="rowsAndamento"
              [totalRecords]="pendenciasEmAndamento.length"
              [rowsPerPageOptions]="[10, 20, 30]"
              (onPageChange)="onPageChangeAndamento($event)">
            </p-paginator>
          </div>
        </div>

        <ng-template #vazioAndamento>
          <div class="text-center text-gray-400 mt-12">
            <i class="pi pi-inbox text-5xl mb-3"></i>
            <p>Nenhuma pendência em andamento.</p>
          </div>
        </ng-template>

      </p-tabpanel>

      <!-- ===========================
           ABA: CONCLUÍDAS
      ============================ -->
      <p-tabpanel [value]="1">

        <div *ngIf="pendenciasConcluidas.length; else vazioConcluidas">
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-6">
            <app-card-pendencia-component
              *ngFor="let item of pendenciasConcluidas | slice:firstConcluidas:(firstConcluidas + rowsConcluidas)"
              [data]="item">
            </app-card-pendencia-component>
          </div>

          <div class="card flex justify-center mt-6">
            <p-paginator
              [first]="firstConcluidas"
              [rows]="rowsConcluidas"
              [totalRecords]="pendenciasConcluidas.length"
              [rowsPerPageOptions]="[10, 20, 30]"
              (onPageChange)="onPageChangeConcluidas($event)">
            </p-paginator>
          </div>
        </div>

        <ng-template #vazioConcluidas>
          <div class="text-center text-gray-400 mt-12">
            <i class="pi pi-check-circle text-5xl mb-3"></i>
            <p>Nenhuma pendência concluída.</p>
          </div>
        </ng-template>

      </p-tabpanel>

    </p-tabpanels>
  </p-tabs>
</div>
