<form [formGroup]="usuarioForm" (ngSubmit)="onSubmit()" class="p-4 bg-gray-900 text-white">
  <div class="flex flex-col gap-4">
    
    <div class="flex flex-col gap-2">
      <label for="nome">Nome</label>
      <input id="nome" type="text" pInputText formControlName="nome" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="email">Email</label>
      <input id="email" type="email" pInputText formControlName="email" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="perfil">Perfil</label>
        <p-select 
            id="perfil" 
            [options]="perfis" 
            formControlName="id_perfil"
            placeholder="Selecione um perfil"
            optionLabel="label"
            optionValue="value">
        </p-select>
    </div>

  </div>

  <div class="flex justify-end gap-2 mt-6">
    <p-button label="Cancelar" severity="secondary" (click)="closeDialog()" />
    <p-button type="submit" label="Salvar" [disabled]="usuarioForm.invalid" />
  </div>
</form>
