<menu-bar></menu-bar>
<div class="admin-dashboard p-4 text-white">
  <h1 class="text-2xl font-bold mb-4">Painel de Administração</h1>

  <p-tabs>
    <p-tablist>
      <p-tab value="0">Gerenciar Usuários</p-tab>
      <p-tab value="1">Gerenciar Templates</p-tab>
    </p-tablist>

    <p-tabpanels>
      <p-tabpanel value="0">
        <div class="p-4 bg-gray-800 rounded-b-lg">
          <p-table [value]="usuarios" styleClass="p-datatable-striped" [loading]="isLoadingUsuarios">
            
            <ng-template pTemplate="caption">
              <div class="flex justify-end">
                <p-button label="Criar Novo Usuário" icon="pi pi-plus" (click)="abrirModalUsuario()" />
              </div>
            </ng-template>

            <ng-template pTemplate="header">
              <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Perfil</th>
                <th>Status</th>
                <th style="width: 10rem">Ações</th>
              </tr>
            </ng-template>
            <ng-template pTemplate="body" let-usuario>
              <tr>
                <td>{{ usuario.nome }}</td>
                <td>{{ usuario.email }}</td>
                <td>{{ usuario.nome_perfil }}</td>
                <td>{{ usuario.status }}</td>
                <td>
                  <p-button icon="pi pi-pencil" styleClass="p-button-sm p-button-info mr-2" (click)="abrirModalUsuario(usuario)" />
                  <p-button icon="pi pi-trash" styleClass="p-button-sm p-button-danger" (click)="deletarUsuario(usuario)" />
                </td>
              </tr>
            </ng-template>
          </p-table>
        </div>
      </p-tabpanel>

      <p-tabpanel value="1">
        </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</div>

<p-confirmDialog></p-confirmDialog>
