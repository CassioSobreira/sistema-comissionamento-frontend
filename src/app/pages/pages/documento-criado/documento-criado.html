<menu-bar></menu-bar>

<div class="p-4 sm:p-6 text-white flex justify-center items-center" style="height: calc(100vh - 80px);">
  <div class="bg-gray-800 p-8 rounded-lg shadow-lg max-w-lg mx-auto text-center border border-gray-700">
    
    <i class="pi pi-check-circle text-6xl text-green-500 mb-6"></i>
    
    <h1 class="text-3xl font-bold mb-4">Documento Criado!</h1>
    
    @if (numeroProtocolo) {
      <p class="text-lg text-gray-300 mb-8">
        O documento com o protocolo <strong>{{ numeroProtocolo }}</strong> foi gerado e enviado para o fluxo de assinaturas.
      </p>
    }

    <div class="flex flex-col sm:flex-row justify-center gap-4 mt-8">
      <p-button 
        label="Baixar Documento (PDF)"
        icon="pi pi-download"
        (click)="baixarDocumento()"
        [loading]="isDownloading">
      </p-button>
      
      <p-button 
        label="Ver Minhas Pendências"
        icon="pi pi-list"
        (click)="irParaPendencias()"
        severity="secondary"
        [outlined]="true">
      </p-button>
    </div>

  </div>
</div>
