<style>
  /* Aplica o estilo base para os filtros de coluna */
  :host ::ng-deep .p-column-filter-row .p-inputtext {
    width: 100%;
    padding: 0.75rem 1rem; /* Equivalente a px-4 py-3 */
    border: 1px solid #d1d5db; /* border-gray-300 */
    border-radius: 0.5rem; /* rounded-lg */
    background: #f9fafb !important; /* bg-gray-50 */
    color: #111827 !important; /* text-gray-900 */
    transition: all 0.2s ease-in-out;
  }

  /* Aplica o efeito de foco (anel azul) */
  :host ::ng-deep .p-column-filter-row .p-inputtext:focus {
    outline: none;
    border-color: #3b82f6; /* focus:border-blue-500 */
    box-shadow: 0 0 0 2px #3b82f6; /* Simula o focus:ring-2 */
  }
</style>

<div class="card border border-neutral-700 bg-neutral-800/20 p-4 sm:p-6 rounded-lg">
    <!-- Título Centralizado -->
    <div class="text-center mb-4">
        <h2 class="text-2xl font-semibold text-white">Colaboradores</h2>
    </div>

    <p-table
        #dt
        [value]="colaboradores"
        dataKey="id_colaborador" 
        [rows]="5"
        [rowsPerPageOptions]="[5, 10, 25]"
        [loading]="loading"
        [paginator]="true"
        [globalFilterFields]="['nome', 'cargo', 'sexo', 'email', 'modulo']"
        [tableStyle]="{ 'min-width': '75rem' }"
    >
        <ng-template pTemplate="caption">
            <div class="flex justify-between items-center">
                <!-- Botão de Upload à esquerda da barra de pesquisa -->
                <button-modal></button-modal>

                <p-iconfield iconPosition="left">
                    <p-inputicon>
                        <i class="pi pi-search"></i>
                    </p-inputicon>
                    <input 
                        pInputText 
                        type="text" 
                        class="
                            px-4 py-3 
                            border border-gray-300 
                            rounded-lg 
                            bg-gray-50 
                            text-gray-900 
                            focus:outline-none 
                            focus:ring-2 
                            focus:ring-blue-500 
                            focus:border-blue-500 
                            transition-all duration-200
                        "
                        (input)="dt.filterGlobal($any($event.target).value, 'contains')" 
                        placeholder="Pesquisar..." 
                    />
                </p-iconfield>
            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="nome" style="width:20%">Nome <p-sortIcon field="nome"></p-sortIcon></th>
                <th pSortableColumn="cargo" style="width:20%">Cargo <p-sortIcon field="cargo"></p-sortIcon></th>
                <th pSortableColumn="sexo" style="width:15%">Sexo <p-sortIcon field="sexo"></p-sortIcon></th>
                <th pSortableColumn="email" style="width:25%">Email <p-sortIcon field="email"></p-sortIcon></th>
                <th pSortableColumn="modulo" style="width:20%">Módulo <p-sortIcon field="modulo"></p-sortIcon></th>
            </tr>
            <tr>
                <th>
                    <p-columnFilter type="text" field="nome" placeholder="Filtrar por nome"></p-columnFilter>
                </th>
                <th>
                    <p-columnFilter type="text" field="cargo" placeholder="Filtrar por cargo"></p-columnFilter>
                </th>
                <th>
                    <p-columnFilter type="text" field="sexo" placeholder="Filtrar por sexo"></p-columnFilter>
                </th>
                <th>
                    <p-columnFilter type="text" field="email" placeholder="Filtrar por email"></p-columnFilter>
                </th>
                <th>
                    <p-columnFilter type="text" field="modulo" placeholder="Filtrar por módulo"></p-columnFilter>
                </th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-colaborador>
            <tr>
                <td>{{ colaborador.nome }}</td>
                <td>{{ colaborador.cargo }}</td>
                <td>{{ colaborador.sexo }}</td>
                <td>{{ colaborador.email }}</td>
                <td>{{ colaborador.modulo }}</td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5">Nenhum colaborador encontrado.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
