<div class="card flex justify-center">
    <!--
        BOTÃO DE GATILHO:
        - Agora chama a função 'abrirModalParaAdicionar()'
        - O 'styleClass' foi REMOVIDO para que ele use a cor padrão do tema,
          igual ao botão 'Importar'.
    -->
    <p-button
      (click)="abrirModalParaAdicionar()"
      icon="pi pi-user-plus"
      label="Adicionar Colaborador"
    /> <!-- 'styleClass' REMOVIDO DAQUI -->

    <!--
        MODAL:
        O título e o botão de salvar agora são dinâmicos.
    -->
    <p-dialog [(visible)]="visible" [modal]="true" [style]="{ width: '30rem' }" [draggable]="false" [closable]="!isLoading">
        <ng-template pTemplate="header">
            <div class="inline-flex items-center justify-center gap-2">
                <i class="pi pi-user text-xl"></i>

                <span class="font-bold whitespace-nowrap">
                  <!-- O título muda se estiver a editar ou a adicionar -->
                  {{ isEditMode ? 'Editar' : 'Adicionar' }} Colaborador
                </span>
            </div>
        </ng-template>

        <!-- Corpo do Modal -->
        <div class="flex flex-col gap-4 mt-4">
            <div class="flex items-center gap-4">
                <label for="nome" class="font-semibold w-24">Nome</label>
                <input pInputText id="nome" class="flex-auto" [(ngModel)]="nome" [disabled]="isLoading" />
            </div>

            <div class="flex items-center gap-4">
                <label for="cargo" class="font-semibold w-24">Cargo</label>
                <p-multiselect id="cargo"
                               [options]="cargosOptions"
                               [(ngModel)]="selectedCargos"
                               optionLabel="name"
                               placeholder="Selecione o(s) cargo(s)"
                               class="flex-auto"
                               [selectionLimit]="1"
                               [disabled]="isLoading"
                               [appendTo]="'body'">
                </p-multiselect>
            </div>

            <div class="flex items-center gap-4">
                <label for="sexo" class="font-semibold w-24">Sexo</label>
                <p-multiselect id="sexo"
                               [options]="sexoOptions"
                               [(ngModel)]="selectedSexos"
                               optionLabel="name"
                               placeholder="Selecione o sexo"
                               class="flex-auto"
                               [selectionLimit]="1"
                               [disabled]="isLoading"
                               [appendTo]="'body'">
                </p-multiselect>
            </div>

            <div class="flex items-center gap-4">
                <label for="email" class="font-semibold w-24">Email</label>
                <input pInputText id="email" class="flex-auto" [(ngModel)]="email" [disabled]="isLoading" />
            </div>

            <div class="flex items-center gap-4">
                <label for="modulo" class="font-semibold w-24">Módulo</label>
                <p-multiselect id="modulo"
                               [options]="modulosOptions"
                               [(ngModel)]="selectedModulos"
                               optionLabel="name"
                               placeholder="Selecione o(s) módulo(s)"
                               class="flex-auto"
                               [disabled]="isLoading"
                               [appendTo]="'body'">
                </p-multiselect>
            </div>
        </div>

        <!-- Rodapé do Modal -->
        <ng-template pTemplate="footer">
            <p-button
              label="Cancelar"
              [text]="true"
              severity="secondary"
              (click)="visible = false"
              [disabled]="isLoading" />

            <p-button
              [label]="isEditMode ? 'Atualizar' : 'Salvar'"
              severity="primary"
              (click)="save()"
              [loading]="isLoading" /> <!-- Mostra um ícone de loading enquanto salva/atualiza -->
        </ng-template>
    </p-dialog>
</div>
