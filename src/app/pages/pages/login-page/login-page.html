<div class="flex min-h-screen items-center justify-center p-4">

  <div class="bg-white rounded-xl p-10 shadow-2xl w-full max-w-md">

    <div class="text-center mb-6">
      <img src="LDP NEGATIVO.png" alt="Logo LDP" class="mx-auto max-w-[150px] h-auto">
    </div>

    <h2 class="text-center text-2xl font-bold mb-8 text-gray-800">Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="flex flex-col gap-6">
        
        <div class="flex flex-col gap-2 text-left">
          <label for="email" class="text-sm font-bold text-gray-600">Email</label>
          <app-input-text-component 
            formControlName="email"
            id="email">
          </app-input-text-component>
        </div>

        <div class="flex flex-col gap-2 text-left">
          <label for="password" class="text-sm font-bold text-gray-600">Senha</label>
          <app-password-input-component 
            formControlName="senha"
            id="password">
          </app-password-input-component>
        </div>

        <div class="flex justify-between items-center mt-4">
          <a 
            (click)="navegarPraEsqueciSenha($event)" 
            class="text-sm font-bold text-blue-600 hover:underline cursor-pointer">
            Esqueci a senha
          </a>
          
          <button 
            type="submit"
            class="px-8 py-3 border-none rounded-lg bg-gradient-to-r from-blue-500 to-blue-600 text-white font-bold cursor-pointer transition-all duration-300 hover:shadow-lg hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed">
            Entrar
          </button>
        </div>
      </div>

    </form> 
  </div>
</div>
